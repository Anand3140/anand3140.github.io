<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Download OMEX Automation App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f1115; color: #e6e8eb; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .card {
      background: #1a1d24; border: 1px solid #2a2e37; border-radius: 20px;
      padding: 40px 32px; width: 100%; max-width: 400px; text-align: center;
    }
    .logo { font-size: 24px; font-weight: 700; color: #4f9dff; margin-bottom: 8px; }
    h1 { font-size: 20px; margin-bottom: 8px; }
    .ver { font-size: 13px; color: #9aa0aa; margin-bottom: 28px; }
    .btn {
      display: block; width: 100%; padding: 16px; background: #4f9dff; color: #fff;
      border: none; border-radius: 12px; font-size: 16px; font-weight: 600;
      text-decoration: none; margin-bottom: 14px; cursor: pointer;
    }
    .btn:active { opacity: 0.85; }
    .note { font-size: 12px; color: #6b7280; line-height: 1.6; margin-top: 8px; }
    .steps { text-align: left; font-size: 13px; color: #9aa0aa; margin-top: 24px;
             background: #0f1115; border-radius: 10px; padding: 16px; line-height: 1.8; }
    .steps b { color: #e6e8eb; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">OMEX Automation</div>
    <h1>Download the App</h1>
    <div class="ver" id="ver">Latest version</div>

   
    <a class="btn" id="apkBtn" href="https://api.omexautomation.com/download/omex-app.apk">⬇️  Download APK</a>

    <div class="note">Android only. iOS coming soon.</div>

    <div class="steps">
      <b>Install steps:</b><br>
      1. Tap "Download APK" above<br>
      2. Open the downloaded file<br>
      3. If asked, allow "Install from unknown sources"<br>
      4. Tap Install — done!
    </div>
  </div>

  <script>
 
    fetch("https://api.omexautomation.com/api/app-version")
      .then(r => r.json())
      .then(d => {
        if (d.latestVersion) {
          document.getElementById("ver").textContent = "Latest version " + d.latestVersion;
        }
      })
      .catch(() => {});
  </script>
</body>
</html>
